name: Render Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy to Render
        required: true
        default: main
        type: string

concurrency:
  group: render-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}

    steps:
      - name: Check out deploy branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_BRANCH }}

      - name: Update Render service branch
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_BRANCH: ${{ env.DEPLOY_BRANCH }}
        run: |
          payload=$(printf '{"branch":"%s"}' "${RENDER_BRANCH}")

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            --header "accept: application/json" \
            --header "authorization: Bearer ${RENDER_API_KEY}" \
            --header "content-type: application/json" \
            --data "${payload}"

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "accept: application/json" \
            --header "authorization: Bearer ${RENDER_API_KEY}" \
            --header "content-type: application/json" \
            --data '{}'
